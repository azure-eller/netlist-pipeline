[project]
name = "netlist-pipeline"
version = "0.1.0"
description = "Schematic in, physics-judged fabrication-ready board out."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary]>=3.2",
  "boto3>=1.35",
  "pydantic-settings>=2.5",
  "structlog>=24",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "sentry-sdk>=2",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "awscli", "boto3-stubs[s3]"]
learned = ["scikit-learn>=1.5", "joblib>=1.4", "numpy>=2", "scipy>=1.14"]
claude = ["claude-agent-sdk>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than a few seconds (Freerouting)"]
