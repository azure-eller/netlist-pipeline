services:
  - type: web
    name: netlist-api
    runtime: docker
    plan: free
    region: oregon
    dockerCommand: uvicorn pipeline.api:app --host 0.0.0.0 --port 8000
    healthCheckPath: /healthz
    envVars:
      - fromGroup: netlist-pipeline
      - key: DATABASE_URL
        fromDatabase: { name: netlist-db, property: connectionString }

  - type: worker
    name: netlist-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerCommand: python -m pipeline.worker
    envVars:
      - fromGroup: netlist-pipeline
      - key: DATABASE_URL
        fromDatabase: { name: netlist-db, property: connectionString }

envVarGroups:
  - name: netlist-pipeline
    envVars:
      - { key: S3_BUCKET, sync: false }
      - { key: S3_REGION, value: us-west-2 }
      - { key: S3_ACCESS_KEY, sync: false }
      - { key: S3_SECRET_KEY, sync: false }
      - { key: S3_ENDPOINT, value: "" }

databases:
  - name: netlist-db
    plan: free
    region: oregon
